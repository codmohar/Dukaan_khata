databases:
  - name: dukaan-db
    databaseName: dukaan
    user: postgres
    plan: free
    ipAllowList: []

services:
  # 1. FastAPI Voice & Vision Backend
  - type: web
    name: dukaan-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        fromDatabase:
          name: dukaan-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: SPEECH_PROVIDER
        value: gemini
      - key: DEFAULT_SHOP_ID
        value: 00000000-0000-0000-0000-000000000001
      - key: CORS_ORIGINS
        value: "*"

  # 2. Next.js Web Frontend & PWA
  - type: web
    name: dukaan-web
    runtime: node
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: dukaan-backend
          property: host
      - key: BACKEND_INTERNAL_URL
        fromService:
          type: web
          name: dukaan-backend
          property: host
