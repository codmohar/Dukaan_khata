databases:
  - name: dukaan-db
    databaseName: dukaan
    user: postgres
    plan: free

services:
  # FastAPI Backend Service
  - type: web
    name: dukaan-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dukaan-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: SPEECH_PROVIDER
        value: gemini
      - key: DEFAULT_SHOP_ID
        value: 00000000-0000-0000-0000-000000000001
      - key: CORS_ORIGINS
        value: "*"

  # Next.js Web Frontend & PWA
  - type: web
    name: dukaan-web
    runtime: node
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: dukaan-backend
          property: host
