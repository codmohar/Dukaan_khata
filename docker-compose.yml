services:
  # Local PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: dukaan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-dukaan}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init_schema.sql:ro
      - ./supabase/migrations/002_kirana_money_flows.sql:/docker-entrypoint-initdb.d/002_kirana_money_flows.sql:ro
      - ./supabase/migrations/003_extended_languages_and_reminders.sql:/docker-entrypoint-initdb.d/003_extended_languages_and_reminders.sql:ro
      - ./supabase/migrations/003_scans.sql:/docker-entrypoint-initdb.d/003_scans.sql:ro
      - ./supabase/migrations/004_advanced_features.sql:/docker-entrypoint-initdb.d/004_advanced_features.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dukaan"]
      interval: 5s
      timeout: 5s
      retries: 5

  # DukaanAI FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dukaan-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgrespassword@db:5432/dukaan}
      - DEFAULT_SHOP_ID=${DEFAULT_SHOP_ID:-00000000-0000-0000-0000-000000000001}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - SPEECH_PROVIDER=${SPEECH_PROVIDER:-sarvam}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - GNANI_API_KEY=${GNANI_API_KEY:-}
      - GNANI_STT_URL=${GNANI_STT_URL:-https://api.gnani.ai/v3/speech-to-text}
      - GNANI_TTS_URL=${GNANI_TTS_URL:-https://api.gnani.ai/v3/text-to-speech}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Next.js Web Frontend & PWA
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: dukaan-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Nginx Unified Single-Port Reverse Proxy
  proxy:
    image: nginx:alpine
    container_name: dukaan-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "4000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - backend

volumes:
  pgdata:
